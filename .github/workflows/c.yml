name: C CI

on:
  push:
    paths:
      - 'Poppy/control/**'
      - 'Poppy/**/Makefile'
      - '.github/workflows/c.yml'
  pull_request:
    paths:
      - 'Poppy/control/**'
      - 'Poppy/**/Makefile'
      - '.github/workflows/c.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-c:
    name: Build C components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential make

      - name: Build control
        working-directory: Poppy/control
        run: make -j

      - name: Clean
        if: always()
        working-directory: Poppy/control
        run: make clean || true
