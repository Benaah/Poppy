name: Android CI (conditional)

on:
  push:
    paths:
      - 'Poppy/androidapp/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Poppy/androidapp/**'
      - '.github/workflows/android.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build (gradle wrapper)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('Poppy/androidapp/gradlew') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        working-directory: Poppy/androidapp
        run: chmod +x gradlew || true

      - name: Build
        working-directory: Poppy/androidapp
        run: ./gradlew assembleDebug --no-daemon
